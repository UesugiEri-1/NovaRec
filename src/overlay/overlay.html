<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>选择录制区域</title>
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: transparent; cursor: crosshair; user-select: none; }
  #dim { position: fixed; inset: 0; display: block; }
  #hint {
    position: fixed; left: 50%; top: 28px; transform: translateX(-50%);
    padding: 10px 18px; border-radius: 10px;
    background: rgba(12, 16, 18, 0.9); border: 1px solid rgba(255,255,255,0.14);
    color: #eaf1ec; font: 13px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif;
    letter-spacing: 0.2px; box-shadow: 0 10px 30px rgba(0,0,0,0.45); white-space: nowrap;
  }
  #hint b { color: #58D68C; font-weight: 600; }
  #size {
    position: fixed; padding: 4px 9px; border-radius: 6px;
    background: rgba(23, 162, 75, 0.96); color: #fff;
    font: 12px/1.3 "Consolas", "Segoe UI", monospace; white-space: nowrap;
    display: none; pointer-events: none; box-shadow: 0 4px 14px rgba(0,0,0,0.35);
  }
  #tip { position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%); color: rgba(231,236,245,0.75); font: 12px/1.5 "Segoe UI", "Microsoft YaHei", sans-serif; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
</style>
</head>
<body>
<canvas id="dim"></canvas>
<div id="hint">拖动鼠标框选录制区域 · <b>Enter</b> 确认 · <b>Esc</b> 取消 · 可重新拖动调整</div>
<div id="size"></div>
<div id="tip">NovaRec 区域录制</div>
<script src="overlay.js"></script>
</body>
</html>
